---
openapi: 3.0.3
info:
  title: Von Neumann Game — Others API
  version: '130'
security:
- bearerAuth: []
servers:
- url: /
  description: Current host
paths:
  "/api/others/alerts":
    get:
      tags:
      - Others
      summary: List persistent alerts for owned Others ships
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [unread]
      responses:
        '200':
          description: Account-wide Others alerts, newest first
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersAlertsResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/others/alerts/{alertId}":
    parameters:
    - "$ref": "#/components/parameters/AlertId"
    patch:
      tags:
      - Others
      summary: Mark one owned Others alert as read
      responses:
        '200':
          description: Updated alert
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersAlertResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/others":
    get:
      tags:
      - Others
      summary: Get the operator Others overview
      responses:
        '200':
          description: Overview
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/others/sector":
    get:
      tags:
      - Others
      summary: Observe a sector using one owned Others fleet
      description: >-
        The coordinates are relative to the owning player's home; absolute
        coordinates are never exposed. shipId designates the owned fleet, and
        the closest active fleet ship supplies the scan. Precision follows the
        same distance, residence-time and visited-sector rules as GET
        /api/sector, using only this fleet's private visit history. A detailed
        observation includes detected probes and ships, with their current
        statuses, only when at least one active ship of the designated fleet is
        physically present in the requested sector. In that local case, every
        planet representation also exposes harvestable, which is true only
        while its remaining resources total more than 5 ECE. The probes
        property, detected ship objects and harvestable fields are otherwise
        omitted, including from precise historical observations.
      parameters:
      - name: shipId
        in: query
        required: true
        description: Public identifier of an owned ship designating its fleet.
        schema:
          type: string
      - name: x
        in: query
        required: true
        description: X coordinate relative to the owning player's home.
        schema:
          type: integer
      - name: y
        in: query
        required: true
        description: Y coordinate relative to the owning player's home.
        schema:
          type: integer
      - name: z
        in: query
        required: true
        description: Z coordinate relative to the owning player's home.
        schema:
          type: integer
      responses:
        '200':
          description: Sector observation with fleet-specific knowledge
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersSectorResponse"
        '400':
          description: Invalid coordinates or insufficient scan data
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: No active ship in the designated fleet can supply the scan
        '422':
          description: Relative coordinates cannot be converted to a valid sector
  "/api/others/fleets":
    get:
      tags:
      - Others
      summary: List owned Others fleets
      responses:
        '200':
          description: Fleet summaries
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/others/fleets/{fleetId}":
    parameters:
    - "$ref": "#/components/parameters/FleetId"
    get:
      tags:
      - Others
      summary: Get one owned fleet
      responses:
        '200':
          description: Fleet detail
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersFleetResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/others/fleets/{fleetId}/visited-sectors":
    parameters:
    - "$ref": "#/components/parameters/FleetId"
    get:
      tags:
      - Others
      summary: List sectors visited by one owned fleet
      description: >-
        Returns the fleet's private navigation history in coordinates relative
        to the owning player's home. This history is independent from probe
        visited-sector history and is used to provide precise BOB scans.
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: Stable page ordered by latest visit, newest first
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersVisitedSectorsResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/others/fleets/{fleetId}/move":
    parameters:
    - "$ref": "#/components/parameters/FleetId"
    post:
      tags:
      - Others
      summary: Schedule independent moves for eligible fleet ships
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        "$ref": "#/components/requestBodies/Move"
      responses:
        '202':
          description: Moves accepted, ignored or blocked
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/others/ships/{shipId}":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    get:
      tags:
      - Others
      summary: Get one owned Others ship
      responses:
        '200':
          description: Ship without absolute coordinates
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersShipResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/others/ships/{shipId}/move":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    post:
      tags:
      - Others
      summary: Schedule an intersector move
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        "$ref": "#/components/requestBodies/Move"
      responses:
        '202':
          "$ref": "#/components/responses/Accepted"
    delete:
      tags:
      - Others
      summary: Request cancellation during the fifteen-minute window
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '202':
          "$ref": "#/components/responses/Accepted"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/others/ships/{shipId}/auxiliaries":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    get:
      tags:
      - Others
      summary: Get a cursor-paginated auxiliary page
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: Stable auxiliary page
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersAuxiliariesResponse"
  "/api/others/ships/{shipId}/auxiliaries/{auxiliaryId}":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    - "$ref": "#/components/parameters/AuxiliaryId"
    get:
      tags:
      - Others
      summary: Get one auxiliary
      responses:
        '200':
          description: Auxiliary detail
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersAuxiliaryResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/others/ships/{shipId}/auxiliaries/tasks":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    post:
      tags:
      - Others
      summary: Atomically schedule an auxiliary task batch
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '202':
          "$ref": "#/components/responses/Accepted"
  "/api/others/ships/{shipId}/auxiliaries/{auxiliaryId}/{task}":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    - "$ref": "#/components/parameters/AuxiliaryId"
    - name: task
      in: path
      required: true
      schema:
        type: string
        enum:
        - mine
        - recall
        - recover-dormant-auxiliary
    post:
      tags:
      - Others
      summary: Schedule one auxiliary task
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '202':
          "$ref": "#/components/responses/Accepted"
  "/api/others/ships/{shipId}/auxiliaries/{auxiliaryId}/transfer-deuterium":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    - "$ref": "#/components/parameters/AuxiliaryId"
    post:
      tags:
      - Others
      summary: Schedule a tank-to-tank deuterium transfer
      description: >-
        shipId identifies the source ship and auxiliaryId an undestroyed
        auxiliary belonging to that ship. The source must belong to the
        authenticated player, be in an active fleet, and not be destroyed or
        removed. The target must belong to the same player; a different fleet
        is allowed. Both ships must have the same sector and neither may be in
        transit when the order is submitted. The auxiliary must be embarked
        and have no current action. No mothership-only restriction applies.

        amount is expressed in propulsion-tank points, not inventory ECE.
        The rounded amount must not exceed the source stock minus its existing
        reservations, or the target capacity minus its stock and reservations.
        The server rejects an excessive amount rather than reducing it.
        There is no additional per-trip cargo limit or minimum fuel reserve
        imposed on the source. Inventory deuterium is not used.

        Acceptance reserves the amount on both ships and marks the auxiliary
        busy, without changing either tank's stock yet. The scheduled completion
        is five minutes after acceptance; actual completion depends on scheduler
        processing. Poll GET /api/others/actions/{actionId} using action.id.
        On success the source is debited, the target credited, both reservations
        released and the auxiliary freed. If the target is missing, destroyed
        or removed at completion, the action fails with target_unavailable and
        the source reservation is released without debiting its tank. The
        completion handler does not recheck sector proximity.

        Ship telemetry exposes deuterium.amount and deuterium.capacity but not
        reservations. Public action data does not expose targetShipId or the
        requested amount; retain the submitted order locally. A successful
        terminal action exposes the transferred amount in result.amount.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        "$ref": "#/components/requestBodies/DeuteriumTransfer"
      responses:
        '202':
          description: Transfer queued; the response contains an action, not an inventory transfer object.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersDeuteriumTransferResponse"
              example:
                action:
                  id: action_0123456789abcdef0123
                  type: deuterium_transfer
                  status: queued
                  actor:
                    kind: others_auxiliary
                    id: aux_0123456789abcdef0123
                  createdAt: '2026-09-08T12:00:00+00:00'
                  updatedAt: '2026-09-08T12:00:00+00:00'
                  endsAt: '2026-09-08T12:05:00+00:00'
        '400':
          description: >-
            bad_request — missing or invalid JSON body; missing/non-string
            targetShipId; missing, non-numeric or non-positive amount; or an
            invalid Idempotency-Key header.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersErrorResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          description: >-
            others_ship_not_found — source missing, not owned, destroyed,
            removed or in an inactive fleet; or target missing or owned by
            another player. others_auxiliary_not_found — auxiliary missing,
            destroyed or not attached to the source ship.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersErrorResponse"
        '409':
          description: >-
            others_auxiliary_busy — auxiliary has a current action or is not
            embarked. idempotency_key_conflict — the key is already associated
            with a different method, path or canonical JSON body for this player.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersErrorResponse"
        '422':
          description: >-
            target_out_of_range — different sectors or at least one ship in
            transit. insufficient_resources — source unreserved tank stock or
            target unreserved tank space is insufficient for the full amount.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersErrorResponse"
              examples:
                outOfRange:
                  value:
                    error:
                      code: target_out_of_range
                      message: Both ships must be in the same sector.
                insufficientResources:
                  value:
                    error:
                      code: insufficient_resources
                      message: Source stock or target tank capacity is insufficient.
        '429':
          "$ref": "#/components/responses/RateLimited"
        '500':
          description: internal_error — unexpected server error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersErrorResponse"
        '503':
          "$ref": "#/components/responses/OthersUnavailable"
  "/api/others/ships/{shipId}/sector/autonomous-units":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    get:
      tags:
      - Others
      summary: Observe locally deployed autonomous units
      responses:
        '200':
          description: Mannys and Others auxiliaries, without absolute coordinates
  "/api/others/ships/{shipId}/inventory":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    get:
      tags:
      - Others
      summary: Get this ship's own inventory
      responses:
        '200':
          description: Resources, objects and reservations
  "/api/others/ships/{shipId}/inventory-transfers":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    post:
      tags:
      - Others
      summary: Schedule an inventory transfer
      description: >-
        Uses an available auxiliary embarked on the source ship to transfer
        resources or inventory items to another owned ship in the same sector.
        The target inventory capacity and the transferred content are reserved
        until the scheduler completes the transfer.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        "$ref": "#/components/requestBodies/InventoryTransfer"
      responses:
        '202':
          description: Transfer accepted for scheduler processing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersInventoryTransferCreateResponse"
  "/api/others/inventory-transfers/{transferId}":
    parameters:
    - name: transferId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Others
      summary: Get a transfer
      responses:
        '200':
          description: Transfer state
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersInventoryTransferResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/others/ships/{shipId}/harvest":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    post:
      tags:
      - Others
      summary: Schedule a planetary swarm harvest
      description: >-
        Reserves 2 ECE of inventory capacity per participating auxiliary. After
        the harvest consumes ten percent of every extracted resource, retained
        deuterium fills the coordinator ship tank first at the canonical rate
        of 100 tank points per ECE. Tank capacity already occupied or reserved
        by in-flight transfers is unavailable; any deuterium overflow is stored
        as an inventory resource. A terminal action result exposes the split in
        result.resources.deuteriumAllocation as tankPoints, tankEquivalentEce
        and inventoryEce.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '202':
          "$ref": "#/components/responses/Accepted"
    delete:
      tags:
      - Others
      summary: Interrupt and recall the harvest swarm
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '202':
          "$ref": "#/components/responses/Accepted"
  "/api/others/crafting/recipes":
    get:
      tags:
      - Others
      summary: Get mothership workshop recipes
      responses:
        '200':
          description: Canonical recipes
  "/api/others/ships/{shipId}/crafts":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    get:
      tags:
      - Others
      summary: List this mothership's crafts
      responses:
        '200':
          description: Crafts
    post:
      tags:
      - Others
      summary: Schedule a mothership craft
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '202':
          "$ref": "#/components/responses/Accepted"
  "/api/others/crafts/{craftId}":
    parameters:
    - name: craftId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Others
      summary: Get one craft
      responses:
        '200':
          description: Craft state
  "/api/others/actions/{actionId}":
    parameters:
    - name: actionId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Others
      summary: Get one scheduler-driven action
      description: >-
        Returns the current persisted action, including terminal failures with
        HTTP 200. For type deuterium_transfer, action follows
        OthersDeuteriumTransferAction: endsAt is the scheduled completion,
        result.amount is present on success, and error describes a failure
        when available. Read this endpoint to track progress; replaying an
        idempotent POST returns the originally stored response.
      responses:
        '200':
          description: Persisted action state
          content:
            application/json:
              schema:
                type: object
                required: [action]
                properties:
                  action:
                    type: object
                    description: >-
                      Action fields depend on type. For deuterium_transfer,
                      see OthersDeuteriumTransferAction.
                    additionalProperties: true
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          description: others_action_not_found — action missing or not owned by this player.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OthersErrorResponse"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/OthersUnavailable"
  "/api/others/ships/{shipId}/weapons/laser":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    post:
      tags:
      - Others
      summary: Schedule an immediate local laser lock
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        "$ref": "#/components/requestBodies/Target"
      responses:
        '202':
          "$ref": "#/components/responses/Accepted"
  "/api/others/ships/{shipId}/missiles":
    parameters:
    - "$ref": "#/components/parameters/ShipId"
    post:
      tags:
      - Others
      summary: Schedule an immediate Others missile launch
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - missileItemId
              - targetId
              properties:
                missileItemId:
                  type: string
                targetId:
                  type: string
      responses:
        '202':
          "$ref": "#/components/responses/Accepted"
  "/api/others/missiles/{missileId}":
    parameters:
    - "$ref": "#/components/parameters/MissileId"
    get:
      tags:
      - Others
      summary: Get an owned missile launch or history
      responses:
        '200':
          description: Missile state without absolute coordinates
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    FleetId:
      name: fleetId
      in: path
      required: true
      schema:
        type: string
    ShipId:
      name: shipId
      in: path
      required: true
      schema:
        type: string
    AuxiliaryId:
      name: auxiliaryId
      in: path
      required: true
      schema:
        type: string
    MissileId:
      name: missileId
      in: path
      required: true
      schema:
        type: string
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        pattern: '^oalert_[a-f0-9]{20}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        An optional key chosen by your client that prevents the same command from
        being executed twice if the request is retried after a timeout or network
        interruption. Keys are shared by all Others commands for the same player.
        Reusing a key with the same method, path and canonical JSON body returns
        the stored HTTP status and body; it does not refresh action state.
        Reusing it for a different command returns 409 idempotency_key_conflict.
        After trimming surrounding whitespace, the key must contain 1 to 128
        visible ASCII characters, with no internal spaces.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]{1,128}$'
  requestBodies:
    DeuteriumTransfer:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/OthersDeuteriumTransferRequest"
          example:
            targetShipId: ship_0123456789abcdef0123
            amount: 32.5
    InventoryTransfer:
      required: true
      description: >-
        The shipId path parameter identifies the source ship. Exactly one
        canonical transfer variant must be supplied according to kind.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/OthersInventoryTransferRequest"
    Move:
      required: true
      description: >-
        The target is a destination relative to the owning player's home sector,
        whose public coordinates are always (0, 0, 0). For a fleet move, every
        eligible ship converges independently on this same home-relative sector.
      content:
        application/json:
          schema:
            type: object
            required:
            - target
            properties:
              target:
                "$ref": "#/components/schemas/RelativeCoordinates"
              leaveAuxiliariesBehind:
                type: boolean
    Target:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - targetId
            properties:
              targetId:
                type: string
  schemas:
    OthersDeuteriumTransferRequest:
      type: object
      required: [targetShipId, amount]
      properties:
        targetShipId:
          type: string
          description: Opaque public id of a target Others ship owned by the same player.
        amount:
          description: >-
            Propulsion-tank points to transfer. Send a positive JSON number.
            The current parser also accepts PHP-numeric strings whose numeric
            value is positive. The value is checked for positivity before
            rounding to four decimal places; values below 0.00005 therefore
            round to zero. Use at least 0.0001 for a nonzero transfer. No fixed
            maximum applies beyond source stock and target capacity.
          oneOf:
          - type: number
            minimum: 0
            exclusiveMinimum: true
          - type: string
            description: Must be numeric according to PHP is_numeric and greater than zero.
    OthersDeuteriumTransferResponse:
      type: object
      required: [action]
      properties:
        action:
          "$ref": "#/components/schemas/OthersDeuteriumTransferAction"
    OthersDeuteriumTransferAction:
      type: object
      required: [id, type, status, actor, createdAt, updatedAt, endsAt]
      properties:
        id:
          type: string
          description: Opaque action id to use with GET /api/others/actions/{actionId}.
        type:
          type: string
          enum: [deuterium_transfer]
        status:
          type: string
          enum: [queued, succeeded, failed]
        actor:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [others_auxiliary]
            id:
              type: string
              description: Public id of the source auxiliary.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Scheduled completion five minutes after acceptance.
        completedAt:
          type: string
          format: date-time
          description: Present after terminal processing.
        result:
          type: object
          description: Present on successful completion.
          required: [outcome, amount]
          properties:
            outcome:
              type: string
              enum: [transferred]
            amount:
              type: number
              description: Transferred amount in tank points, rounded to four decimals.
        error:
          description: >-
            Present when a failure reason was recorded, including
            target_unavailable if the completion handler finds the target
            missing, destroyed or removed. Other lifecycle failures may also
            terminate the action; do not assume every failed action has error.
          allOf:
          - "$ref": "#/components/schemas/OthersError"
    OthersError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    OthersErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          "$ref": "#/components/schemas/OthersError"
    OthersInventoryTransferRequest:
      oneOf:
      - "$ref": "#/components/schemas/OthersInventoryResourceTransferRequest"
      - "$ref": "#/components/schemas/OthersInventoryItemTransferRequest"
      discriminator:
        propertyName: kind
        mapping:
          resource: "#/components/schemas/OthersInventoryResourceTransferRequest"
          item: "#/components/schemas/OthersInventoryItemTransferRequest"
    OthersInventoryResourceTransferRequest:
      type: object
      additionalProperties: false
      required: [actorAuxiliaryId, targetShipId, kind, resourceType, amount]
      properties:
        actorAuxiliaryId:
          type: string
          description: >-
            Public id of an available auxiliary embarked on the source ship.
        targetShipId:
          type: string
          description: Public id of an owned ship in the same sector.
        kind:
          type: string
          enum: [resource]
        resourceType:
          type: string
          enum: [deuterium, metals, ice, carbon_compounds]
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Positive resource quantity expressed in ECE.
    OthersInventoryItemTransferRequest:
      type: object
      additionalProperties: false
      required: [actorAuxiliaryId, targetShipId, kind, itemIds]
      properties:
        actorAuxiliaryId:
          type: string
          description: >-
            Public id of an available auxiliary embarked on the source ship.
        targetShipId:
          type: string
          description: Public id of an owned ship in the same sector.
        kind:
          type: string
          enum: [item]
        itemIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            Public ids of available items in the source inventory. Every item
            must individually fit in the auxiliary's 2 ECE hold.
          items:
            type: string
    OthersInventoryTransferBase:
      type: object
      required: [id, kind, status, actionId, endsAt]
      properties:
        id:
          type: string
          description: Public transfer identifier.
        kind:
          type: string
          enum: [resource, item]
        status:
          type: string
          enum: [queued, succeeded, failed]
        actionId:
          type: string
          description: Public id of the scheduler-driven auxiliary action.
        endsAt:
          type: string
          format: date-time
        result:
          type: object
          required: [outcome]
          properties:
            outcome:
              type: string
              enum: [transferred]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    OthersInventoryResourceTransfer:
      allOf:
      - "$ref": "#/components/schemas/OthersInventoryTransferBase"
      - type: object
        required: [kind, resourceType, amount]
        properties:
          kind:
            type: string
            enum: [resource]
          resourceType:
            type: string
            enum: [deuterium, metals, ice, carbon_compounds]
          amount:
            type: number
    OthersInventoryItemTransfer:
      allOf:
      - "$ref": "#/components/schemas/OthersInventoryTransferBase"
      - type: object
        required: [kind, itemIds]
        properties:
          kind:
            type: string
            enum: [item]
          itemIds:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
    OthersInventoryTransfer:
      oneOf:
      - "$ref": "#/components/schemas/OthersInventoryResourceTransfer"
      - "$ref": "#/components/schemas/OthersInventoryItemTransfer"
      discriminator:
        propertyName: kind
        mapping:
          resource: "#/components/schemas/OthersInventoryResourceTransfer"
          item: "#/components/schemas/OthersInventoryItemTransfer"
    OthersInventoryTransferAction:
      type: object
      required: [id, type, status, actor, createdAt, updatedAt, endsAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [inventory_transfer]
        status:
          type: string
          enum: [queued, succeeded, failed]
        actor:
          type: object
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [others_auxiliary]
            id:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
    OthersInventoryTransferCreateResponse:
      type: object
      required: [transfer, action]
      properties:
        transfer:
          "$ref": "#/components/schemas/OthersInventoryTransfer"
        action:
          "$ref": "#/components/schemas/OthersInventoryTransferAction"
    OthersInventoryTransferResponse:
      type: object
      required: [transfer]
      properties:
        transfer:
          "$ref": "#/components/schemas/OthersInventoryTransfer"
    OthersSectorResponse:
      type: object
      required: [sector]
      properties:
        sector:
          "$ref": "#/components/schemas/OthersSectorObservation"
    OthersSectorObservation:
      type: object
      required: [relativeCoordinates, distance, knowledgeLevel, confidence, scan]
      properties:
        relativeCoordinates:
          "$ref": "#/components/schemas/RelativeCoordinates"
        distance:
          type: integer
          minimum: 0
          description: Distance from the closest active ship in the designated fleet.
        knowledgeLevel:
          type: string
          enum: [detailed, neighbor_scan, distant_scan, long_range_estimation]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        objects:
          type: array
          description: >-
            Detailed natural sector content and observable moving projectiles.
            Detected ship entries are included only when a ship of the
            designated fleet is physically present in this sector.
          items:
            "$ref": "#/components/schemas/OthersObservedSectorObject"
        probes:
          type: array
          description: >-
            Probes physically observable in the sector and their live status.
            Present, possibly empty, only when a ship of the designated fleet is
            physically present in the requested sector.
          items:
            "$ref": "#/components/schemas/OthersObservedProbe"
        estimatedObjects:
          type: object
          additionalProperties: true
        possibleObjects:
          type: array
          items:
            type: string
        navigationalRisk:
          type: string
        message:
          type: string
        scan:
          type: object
          required: [currentSectorResidenceSeconds, requiredResidenceSeconds, scanQuality, source]
          properties:
            currentSectorResidenceSeconds:
              type: integer
              minimum: 0
            requiredResidenceSeconds:
              type: integer
              minimum: 0
            scanQuality:
              type: number
              minimum: 0
              maximum: 1
            source:
              type: object
              required: [kind, id]
              properties:
                kind:
                  type: string
                  enum: [others_ship]
                id:
                  type: string
                  description: Public identifier of the fleet ship supplying the scan.
    OthersObservedProbe:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [idle, preparing, accelerating, cruising, decelerating, orbiting, disabled, trapped_by_black_hole, dead]
    OthersObservedSectorObject:
      type: object
      additionalProperties: true
      properties:
        id:
          oneOf:
          - type: string
          - type: integer
        type:
          type: string
        observedClass:
          type: string
          description: Present on dynamically observed ships and projectiles.
        status:
          type: string
          description: Current status of a dynamically observed ship.
        estimated:
          type: boolean
        harvestable:
          type: boolean
          description: >-
            Present only on planets observed locally by an Others fleet ship,
            including planet entries nested in bookmarkTargets and
            minableTargets. True when remaining planetary resources total
            strictly more than 5 ECE.
        movement:
          type: object
          properties:
            direction:
              type: object
              required: [x, y, z]
              properties:
                x:
                  type: number
                y:
                  type: number
                z:
                  type: number
    RelativeSector:
      type: object
      required: [relative]
      properties:
        relative:
          "$ref": "#/components/schemas/RelativeCoordinates"
    OthersShip:
      type: object
      required: [id, fleetId, type, status, integrity, maxIntegrity, deuterium, inventoryCapacityEce, location, sector, movement, createdAt, updatedAt]
      properties:
        id:
          type: string
        fleetId:
          type: string
        type:
          type: string
          enum: [mothership, standard]
        status:
          type: string
        integrity:
          type: integer
        maxIntegrity:
          type: integer
        deuterium:
          type: object
          required: [amount, capacity]
          description: Propulsion-tank stock and capacity, expressed in tank points.
          properties:
            amount:
              type: number
            capacity:
              type: number
        inventoryCapacityEce:
          type: number
        location:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [in_sector, transit, removed, destroyed]
        sector:
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/RelativeSector"
          description: >-
            Current sector relative to the owning player's home. Null while the
            ship is between sectors.
        movement:
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/OthersShipMovement"
          description: Active movement details, or null while the ship is not moving.
        auxiliaryCount:
          type: integer
        deployedAuxiliaryCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OthersShipMovement:
      type: object
      required: [phase, target, arrivalAt]
      properties:
        phase:
          type: string
          enum: [waiting_to_depart, transit]
        target:
          "$ref": "#/components/schemas/RelativeCoordinates"
          description: Destination relative to the owning player's home.
        arrivalAt:
          type: string
          format: date-time
          description: Scheduled arrival date and time.
    OthersShipResponse:
      type: object
      required: [ship]
      properties:
        ship:
          "$ref": "#/components/schemas/OthersShip"
    OthersFleet:
      type: object
      required: [id, status, ships, activeActions, createdAt, updatedAt]
      properties:
        id:
          type: string
        status:
          type: string
        ships:
          type: array
          items:
            "$ref": "#/components/schemas/OthersShip"
        activeActions:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OthersFleetResponse:
      type: object
      required: [fleet]
      properties:
        fleet:
          "$ref": "#/components/schemas/OthersFleet"
    OthersVisitedSector:
      type: object
      required: [relativeCoordinates, firstVisitedAt, lastVisitedAt, visitCount]
      properties:
        relativeCoordinates:
          "$ref": "#/components/schemas/RelativeCoordinates"
        firstVisitedAt:
          type: string
          format: date-time
        lastVisitedAt:
          type: string
          format: date-time
        visitCount:
          type: integer
          minimum: 1
    OthersVisitedSectorsResponse:
      type: object
      required: [visitedSectors]
      properties:
        visitedSectors:
          type: array
          items:
            "$ref": "#/components/schemas/OthersVisitedSector"
        nextCursor:
          type: string
    OthersAuxiliary:
      type: object
      required: [id, status, locationType, spatialState, capacityEce, cargo]
      properties:
        id:
          type: string
        status:
          type: string
        locationType:
          type: string
        spatialState:
          type: string
        capacityEce:
          type: number
        cargo:
          type: object
          required: [deuterium, metals, ice, carbon_compounds]
          properties:
            deuterium:
              type: number
            metals:
              type: number
            ice:
              type: number
            carbon_compounds:
              type: number
        sector:
          "$ref": "#/components/schemas/RelativeSector"
          description: >-
            Present only when the auxiliary is separated from its carrier, or
            while its carrier is in transit. Coordinates are relative to the
            owning player's home.
        action:
          type: object
    OthersAuxiliariesResponse:
      type: object
      required: [auxiliaries]
      properties:
        auxiliaries:
          type: array
          items:
            "$ref": "#/components/schemas/OthersAuxiliary"
        nextCursor:
          type: string
    OthersAuxiliaryResponse:
      type: object
      required: [auxiliary]
      properties:
        auxiliary:
          "$ref": "#/components/schemas/OthersAuxiliary"
    OthersAlert:
      type: object
      required: [id, shipId, type, status, phase, message, createdAt, updatedAt, readAt]
      properties:
        id:
          type: string
          pattern: '^oalert_[a-f0-9]{20}$'
        shipId:
          type: string
          description: Opaque public identifier of the firing or victim Others ship concerned by this missile or motorized-asteroid alert.
        type:
          type: string
          enum: [missile_resolution, missile_damage, asteroid_impact_damage]
        status:
          type: string
          enum: [unread, read]
        phase:
          type: string
          enum: [weapon_result, weapon_damage]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
    OthersAlertsResponse:
      type: object
      required: [alerts]
      properties:
        alerts:
          type: array
          items:
            "$ref": "#/components/schemas/OthersAlert"
    OthersAlertResponse:
      type: object
      required: [alert]
      properties:
        alert:
          "$ref": "#/components/schemas/OthersAlert"
    RelativeCoordinates:
      type: object
      required:
      - x
      - "y"
      - z
      properties:
        x:
          type: integer
        "y":
          type: integer
        z:
          type: integer
  responses:
    Accepted:
      description: Accepted for scheduler processing; no terminal universe effect
        has run inline
    Unauthorized:
      description: unauthorized — missing or invalid bearer token.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/OthersErrorResponse"
    Forbidden:
      description: others_permission_required — the authenticated account cannot control Others fleets.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/OthersErrorResponse"
    RateLimited:
      description: rate_limit_exceeded — too many API requests for this bearer token.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Window reset time as a Unix timestamp in seconds.
          schema:
            type: integer
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/OthersErrorResponse"
    OthersUnavailable:
      description: others_unavailable — Others storage or required idempotency storage is unavailable.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/OthersErrorResponse"
    NotFound:
      description: Owned resource not found
    Conflict:
      description: State or idempotency conflict
